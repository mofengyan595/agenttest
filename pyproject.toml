[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttest"
version = "0.1.0"
description = "AI-assisted API testing platform (incremental starter)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
agent = [
  "langgraph>=1,<2",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "mcp>=2,<3",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".python311"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttest"
version = "0.1.0"
description = "Bounded AI API test planning with trusted policies and deterministic execution"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.20,<1",
  "openapi-spec-validator>=0.7,<1",
]

[project.optional-dependencies]
agent = [
  "langgraph==1.2.14",
]
mcp = [
  "mcp==2.3.0",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".python311"]

[tool.ruff.lint]
select = ["E", "F", "I"]

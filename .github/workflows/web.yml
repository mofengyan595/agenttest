name: Web Console checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web / ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Disposable API dependencies
        working-directory: .
        shell: bash
        run: |
          python -m venv .venv
          "${{ matrix.python }}" -m pip install -r requirements-agent.lock
          "${{ matrix.python }}" -m pip install --no-build-isolation --no-deps -e '.[dev,agent,mcp]'
      - name: Browser runtime
        shell: bash
        run: npx playwright install --with-deps chromium
      - name: Isolated pagination and browser acceptance
        run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
          LANGSMITH_TRACING: 'false'
          LANGCHAIN_TRACING_V2: 'false'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: console-e2e-${{ matrix.os }}
          path: web/test-results/

name: Keyless Python checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / ${{ matrix.profile }} / Python 3.11
    runs-on: ${{ matrix.os }}
    # Windows 6031212: 1785 offline tests took 13m28s before the remaining checks.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [base, agent]
        include:
          - os: ubuntu-latest
            python: .venv/bin/python
          - os: windows-latest
            python: .venv/Scripts/python.exe
          - profile: base
            lock: requirements-dev.lock
            extras: .[dev]
            smoke: ''
          - profile: agent
            lock: requirements-agent.lock
            extras: .[dev,agent,mcp]
            smoke: --workflow
    defaults:
      run:
        shell: bash
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-agent.lock
            requirements-mcp.lock
      - name: Create project virtual environment
        run: python -m venv .venv
      - name: Install pinned dependencies
        run: |
          "${{ matrix.python }}" -m pip install -r "${{ matrix.lock }}"
          "${{ matrix.python }}" -m pip install --no-build-isolation --no-deps -e '${{ matrix.extras }}'
      - name: Installed regression fixture check
        if: matrix.profile == 'agent'
        run: '"${{ matrix.python }}" -m pytest -q tests/test_nl_entry_evaluation.py::test_model_disabled_replay_derives_contract_from_old_original_text'
      - name: Offline tests
        run: '"${{ matrix.python }}" -m pytest -q'
      - name: Exported fixed regressions without models
        run: |
          mkdir -p runs
          "${{ matrix.python }}" -m pytest examples/regressions -q --basetemp=runs/pytest-regressions
      - name: Ruff
        run: '"${{ matrix.python }}" -m ruff check .'
      - name: Dependency consistency
        run: '"${{ matrix.python }}" -m pip check'
      - name: Explicit disposable loopback HTTP check
        run: '"${{ matrix.python }}" scripts/smoke_local_http.py ${{ matrix.smoke }}'
      - name: Natural-language paths over loopback with FakeLLM
        if: matrix.profile == 'agent'
        run: '"${{ matrix.python }}" scripts/smoke_natural_http.py'
      - name: Read-only failure investigation over loopback with FakeAnalyzer
        if: matrix.profile == 'agent'
        run: '"${{ matrix.python }}" scripts/smoke_investigation_http.py'
      - name: MCP SDK stdio disposable mini target check
        if: matrix.profile == 'agent'
        run: '"${{ matrix.python }}" scripts/smoke_mcp_stdio.py'
      - name: Unified keyless demo entry
        run: |
          "${{ matrix.python }}" -m agenttest showcase --case normal
          "${{ matrix.python }}" -m agenttest showcase --case fault
      - name: Full offline delivery demo
        if: matrix.profile == 'agent'
        run: '"${{ matrix.python }}" -m agenttest showcase --case all'

  deepagents:
    name: Deep Agents runtime / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-deepagents.lock
      - name: Install the pinned product extra
        run: |
          python -m pip install -c requirements-deepagents.lock '.[dev,deepagents]'
          python -m pip check
          python -c 'import deepagents; from agenttest.deep_harness.skills import skill_files; assert len(skill_files()) == 3'
      - name: Keyless runtime, policy and context integration
        run: |
          python -m pytest -q tests/test_product_agent.py tests/test_task_completion.py \
            tests/test_planning_flow_instances.py tests/test_focus_order_ambiguity.py \
            tests/test_mixed_planning_round3.py
